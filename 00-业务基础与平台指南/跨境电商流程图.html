<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跨境电商流程图</title>
<style>
:root{--bg:#edf2f4;--paper:#ffffff;--ink:#203b4b;--muted:#526978;--line:#77909d;--green:#146c5b;--greenbg:#edf8f3;--orange:#97521b;--orangebg:#fff5e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif;padding-inline:24px;padding-block:32px}main{max-width:1280px;margin:auto}header{margin-bottom:28px}h1,h2{font-family:"Helvetica Neue","PingFang SC",sans-serif;line-height:1.3;text-wrap:balance}h1{font-size:30px;margin:0 0 12px}h2{font-size:22px;margin:0 0 6px}p{margin:8px 0;max-width:76ch}.meta{font-size:13px;color:var(--muted);letter-spacing:.06em}figure{margin:0 0 24px;padding:24px;background:var(--paper);border:1px solid #d5e0e5;border-radius:4px}.scroll{overflow-x:auto;margin-top:16px}svg{display:block;width:100%;height:auto;color:var(--ink)}svg text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:currentColor;font-size:17px;text-anchor:middle}svg .small{font-size:13px;fill:var(--muted)}svg .group{font-size:16px;font-weight:600;fill:var(--muted);text-anchor:start}svg .box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}svg .green{fill:var(--greenbg);stroke:var(--green);stroke-width:1.5}svg .orange{fill:var(--orangebg);stroke:var(--orange);stroke-width:1.5}svg .edge{fill:none;stroke:currentColor;stroke-width:1.6;marker-end:url(#arrow)}svg .feedback{fill:none;stroke:var(--orange);stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#back)}figcaption{font-size:14px;color:var(--muted);margin-top:12px}footer{font-size:14px;color:var(--muted);padding-block:0 20px}@media(max-width:700px){body{padding-inline:16px;padding-block:20px}figure{padding:16px}.scroll svg{width:1080px;max-width:none}h1{font-size:26px}}@media print{body{padding:0;background:white}figure{break-inside:avoid;border:0;padding:10px}.scroll{overflow:visible}svg{width:100%!important}footer{font-size:11px}}
</style>
</head>
<body>
<main>
<header><div class="meta">业务基础 · 通用框架 · 非公司已确认流程</div><h1>跨境电商，从选品到回款</h1><p>实线表示推进或交接；虚线表示异常处理和结果反馈。</p></header>
<figure><h2>一、整门生意怎么走</h2><p>以提前海外备货为例：货物准备和商品销售准备可以同时推进，汇合后才能正常接单交付。</p><div class="scroll">
<svg viewBox="0 0 1180 620" role="img" aria-label="选品合规后，采购运输入仓与商品资料上架两条路径并行，汇合为可售商品，再经下单交付、对账回款和经营复盘，反馈下一轮选品采购。">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#97521b"/></marker></defs>
<text class="group" x="24" y="28">决定卖什么</text><text class="group" x="320" y="28">准备货物与销售页面</text><text class="group" x="900" y="28">接单与交付</text>
<rect class="box" x="24" y="170" width="190" height="86" rx="6"/><text x="119" y="204">市场调研与选品</text><text class="small" x="119" y="232">需求、竞争、预计利润</text>
<path class="edge" d="M119 170 V100 H260"/><text class="small" x="185" y="88">采购前核实</text>
<rect class="box" x="260" y="64" width="210" height="72" rx="6"/><text x="365" y="94">开店与合规准备</text><text class="small" x="365" y="118">资质、认证、授权、进出口</text>
<path class="edge" d="M470 100 H520"/><text class="small" x="495" y="87">备货</text>
<rect class="box" x="520" y="64" width="156" height="72" rx="6"/><text x="598" y="94">采购与验货</text><text class="small" x="598" y="118">数量、质量、包装</text>
<path class="edge" d="M598 136 V180"/><text class="small" x="640" y="163">发运</text>
<rect class="box" x="520" y="180" width="156" height="72" rx="6"/><text x="598" y="210">运输与清关</text><text class="small" x="598" y="234">详见下方物流图</text>
<path class="edge" d="M676 216 H727"/><text class="small" x="702" y="202">入仓</text>
<rect class="green" x="727" y="180" width="145" height="72" rx="6"/><text x="799" y="210">验收与库存</text><text class="small" x="799" y="234">到仓 ≠ 已可售</text>
<path class="edge" d="M365 136 V308 H520"/><text class="small" x="417" y="295">同步准备</text>
<rect class="box" x="520" y="272" width="156" height="72" rx="6"/><text x="598" y="302">商品资料与报价</text><text class="small" x="598" y="326">图片、属性、价格</text>
<path class="edge" d="M676 308 H938"/><text class="small" x="798" y="295">页面、价格和销售状态就绪</text>
<path class="edge" d="M872 216 H1017 V272"/><text class="small" x="948" y="202">可售库存就绪</text>
<rect class="green" x="938" y="272" width="160" height="72" rx="6"/><text x="1018" y="302">商品可以购买</text><text class="small" x="1018" y="326">广告与活动按需开展</text>
<path class="edge" d="M1018 344 V408"/><text class="small" x="1060" y="380">买家下单</text>
<rect class="green" x="938" y="408" width="160" height="72" rx="6"/><text x="1018" y="438">订单处理与交付</text><text class="small" x="1018" y="462">拣货、打包、配送</text>
<path class="edge" d="M938 444 H856"/><text class="small" x="897" y="429">核对结果</text>
<rect class="orange" x="686" y="408" width="170" height="72" rx="6"/><text x="771" y="438">对账与回款</text><text class="small" x="771" y="462">收入、扣费、退款、赔付</text>
<path class="edge" d="M686 444 H598"/><text class="small" x="642" y="429">看实际结果</text>
<rect class="orange" x="428" y="408" width="170" height="72" rx="6"/><text x="513" y="438">经营复盘</text><text class="small" x="513" y="462">利润、库存、补货或停售</text>
<path class="feedback" d="M428 444 H119 V256"/><text class="small" x="256" y="429">反馈下一轮选品与采购</text>
<path class="feedback" d="M1018 480 V540 H907"/><text class="small" x="1052" y="518">发生问题</text>
<rect class="orange" x="717" y="508" width="190" height="68" rx="6"/><text x="812" y="538">客服、退货与退款</text><text class="small" x="812" y="562">核实货物和费用去向</text>
<path class="feedback" d="M771 508 V480"/><path class="feedback" d="M717 542 H513 V480"/><text class="small" x="606" y="529">反馈质量与损失</text>
</svg></div><figcaption>合规贯穿采购、进口与销售；库存、售后和对账持续进行，不必等整批货售完。</figcaption></figure>
<figure><h2>二、货从国内怎么到消费者手里</h2><p>空运／海运是运输选择，平台仓／第三方仓／自有仓是仓储选择，不需要依次全部经过。</p><div class="scroll">
<svg viewBox="0 0 1180 560" role="img" aria-label="国内供应商经交货与出口手续（按需集货）、空运或海运、目的国清关，分别进入平台仓或卖家管理的仓库，再按相应模式交付消费者；跨境直邮则在买家下单后跨境发运。">
<rect x="16" y="20" width="400" height="208" rx="8" fill="#f3f6f8"/><rect x="432" y="20" width="192" height="208" rx="8" fill="#f3f6f8"/><rect x="640" y="20" width="520" height="392" rx="8" fill="#edf8f3"/>
<text class="group" x="32" y="49">国内｜备货与出口</text><text class="group" x="448" y="49">跨境｜国际运输</text><text class="group" x="656" y="49">目的地｜进口、仓储与配送</text>
<rect class="box" x="32" y="100" width="150" height="70" rx="6"/><text x="107" y="129">供应商备货</text><text class="small" x="107" y="154">验货、包装、贴标</text>
<path class="edge" d="M182 135 H246"/><text class="small" x="214" y="120">交货</text>
<rect class="box" x="246" y="100" width="150" height="70" rx="6"/><text x="321" y="122">国内交货</text><text x="321" y="143">与出口手续</text><text class="small" x="321" y="162">按需集货、出口申报</text>
<path class="edge" d="M396 135 H420 V91 H460"/><path class="edge" d="M420 135 V178 H460"/>
<rect class="box" x="460" y="64" width="136" height="54" rx="6"/><text x="528" y="98">空运</text>
<rect class="box" x="460" y="151" width="136" height="54" rx="6"/><text x="528" y="185">海运</text>
<path class="edge" d="M596 91 H617 V135 H663"/><path class="edge" d="M596 178 H617 V135"/>
<rect class="box" x="663" y="100" width="145" height="70" rx="6"/><text x="735" y="129">进口清关放行</text><text class="small" x="735" y="154">按适用要求申报缴税</text>
<path class="edge" d="M808 135 H840 V90 H885"/><text class="small" x="842" y="76">送平台仓</text>
<rect class="green" x="885" y="60" width="250" height="65" rx="6"/><text x="1010" y="88">平台仓 · 如 noon FBN</text><text class="small" x="1010" y="111">验收入仓，确认可售</text>
<path class="edge" d="M808 135 H840 V210 H885"/><text class="small" x="840" y="246">送其他仓</text>
<rect class="green" x="885" y="176" width="250" height="65" rx="6"/><text x="1010" y="203">第三方海外仓／自有仓</text><text class="small" x="1010" y="227">按约定管理库存与订单</text>
<path class="edge" d="M1135 208 H1148 V138 H1010 V125"/><text class="small" x="1020" y="153">也可按需转补平台仓</text>
<path class="edge" d="M1010 241 V285 H850"/><text class="small" x="978" y="275">下单后按实际模式发货</text>
<rect class="green" x="672" y="257" width="178" height="62" rx="6"/><text x="761" y="283">卖家侧订单处理</text><text class="small" x="761" y="305">如 FBP，配送分工另核实</text>
<path class="edge" d="M761 319 V365 H558"/><text class="small" x="685" y="351">安排配送</text>
<path class="edge" d="M1135 90 H1170 V416 H528 V401"/><text class="small" x="940" y="403">下单后平台拣货、打包、配送</text>
<rect class="green" x="348" y="329" width="210" height="72" rx="6"/><text x="453" y="359">消费者收货</text><text class="small" x="453" y="383">核实送达，异常转售后</text>
<text class="small" x="211" y="278">货代可协助运输、单证与交接</text><text class="small" x="211" y="301">服务范围与责任以实际约定为准</text>
<path class="feedback" d="M348 365 H250"/><rect class="orange" x="32" y="337" width="218" height="62" rx="6"/><text x="141" y="363">退货接收点</text><text class="small" x="141" y="386">按指定地址返回并验收</text>
<text class="small" x="455" y="433">退回后检查：可再售／维修／退回／报废，按规则和授权处理</text>
<line x1="24" y1="459" x2="1155" y2="459" stroke="#77909d"/>
<text class="group" x="32" y="493">另一种顺序：跨境直邮</text>
<text x="145" y="534">买家先下单</text><path class="edge" d="M225 528 H310"/><text x="420" y="534">境外备货并跨境发运</text><path class="edge" d="M543 528 H625"/><text x="725" y="534">目的地清关与配送</text><path class="edge" d="M847 528 H937"/><text x="1035" y="534">消费者收货</text>
</svg></div><figcaption>物流主图展示提前海外备货的常见路径。FBN／FBP 不决定进口方式；FBP 不等于跨境直邮。具体服务是否可用，以站点、商品、账户及合同为准。</figcaption></figure>
<footer>本图不是平台官方规则或执行授权。具体费用、时效和责任范围需按适用规则核实。销售额 ≠ 实际回款 ≠ 利润。</footer>
</main>
</body>
</html>
